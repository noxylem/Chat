name: Signal Reporting Android

on:
  push:
    branches:
      - signal-reporting-android-scaffold
      - main
    paths:
      - "signal-reporting-android/**"
      - ".github/workflows/signal-reporting-android.yml"
  pull_request:
    paths:
      - "signal-reporting-android/**"
      - ".github/workflows/signal-reporting-android.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-reporting-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: assembleDebug
        run: ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
